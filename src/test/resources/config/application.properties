# Test overrides, loaded on top of src/main/resources/application.properties: Boot reads both
# classpath:/application.properties and classpath:/config/application.properties, the latter
# winning. Also used by ./mvnw spring-boot:test-run.

# Every trace recorded in tests and in the local run (ADR 0021).
management.tracing.sampling.probability=1.0
# Plain text logs: test failures are read by people in the Maven output, not by a log pipeline.
# The application itself logs ECS JSON.
logging.structured.format.console=
