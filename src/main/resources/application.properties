spring.application.name=double-entry-ledger

# Request handling on virtual threads (Java 25 removed synchronized pinning, JEP 491).
spring.threads.virtual.enabled=true

# Flyway owns the schema; Hibernate only checks that the mappings match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading outside transactions: every query happens inside the service layer.
spring.jpa.open-in-view=false
# Flush entity updates sorted by primary key, the same id order every strategy locks in, so two
# transactions updating the same accounts never take the row locks in opposite orders.
spring.jpa.properties.hibernate.order_updates=true

# RFC 9457 problem details for framework errors (missing header, malformed body).
spring.mvc.problemdetails.enabled=true

# Datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD,
# or from Testcontainers when started with ./mvnw spring-boot:test-run.

# Phase 3: transactional outbox to Kafka (ADR 0016, ADR 0018).
# Broker from SPRING_KAFKA_BOOTSTRAP_SERVERS, or from Testcontainers in tests.
ledger.outbox.topic=ledger.transfers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# The consumer reads its own envelope type, so no Java type travels in the headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Idempotent producer: broker-side retries cannot duplicate or reorder within a partition.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail a send within the relay's 10 s wait instead of the 2 minute default, so a broker outage
# ends the batch and the rows stay pending.
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.producer.properties.max.block.ms=5000
# The Kafka clients log every configuration value at INFO on each start.
logging.level.org.apache.kafka=WARN
