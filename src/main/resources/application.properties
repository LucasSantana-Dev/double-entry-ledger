spring.application.name=double-entry-ledger

# Request handling on virtual threads (Java 25 removed synchronized pinning, JEP 491).
spring.threads.virtual.enabled=true

# Flyway owns the schema; Hibernate only checks that the mappings match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading outside transactions: every query happens inside the service layer.
spring.jpa.open-in-view=false
# Flush entity updates sorted by primary key, the same id order every strategy locks in, so two
# transactions updating the same accounts never take the row locks in opposite orders.
spring.jpa.properties.hibernate.order_updates=true

# RFC 9457 problem details for framework errors (missing header, malformed body).
spring.mvc.problemdetails.enabled=true

# Datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD,
# or from Testcontainers when started with ./mvnw spring-boot:test-run.
