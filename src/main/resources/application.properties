spring.application.name=double-entry-ledger

# Request handling on virtual threads (Java 25 removed synchronized pinning, JEP 491).
spring.threads.virtual.enabled=true

# Flyway owns the schema; Hibernate only checks that the mappings match it.
spring.jpa.hibernate.ddl-auto=validate
# No lazy loading outside transactions: every query happens inside the service layer.
spring.jpa.open-in-view=false
# Flush entity updates sorted by primary key, the same id order every strategy locks in, so two
# transactions updating the same accounts never take the row locks in opposite orders.
spring.jpa.properties.hibernate.order_updates=true

# RFC 9457 problem details for framework errors (missing header, malformed body).
spring.mvc.problemdetails.enabled=true

# Phase 7: admission control (ADR 0033). At most 16 transfers and deposits in progress; a request
# that finds no slot within 100 ms gets 503 with Retry-After instead of waiting for a database
# connection after the client has given up. 0 switches the filter off.
ledger.admission.max-concurrent=16
ledger.admission.max-wait=PT0.1S
# Phase 8 (spec 2026-11-18-pool-bounds): a separate limit for GET /accounts/{id}, with its own
# slots, so reads never take a write slot and the other way round. 0, the default, switches it
# off; the experiment's readlimit arm runs 16 slots and a 100 ms wait.
ledger.admission.reads.max-concurrent=0
ledger.admission.reads.max-wait=PT0.1S
# A request that gets no database connection within spring.datasource.hikari.connection-timeout
# (Hikari's default, 30 s, unless set) answers 503 with Retry-After and /problems/overloaded.

# Datasource comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD,
# or from Testcontainers when started with ./mvnw spring-boot:test-run.

# Phase 3: transactional outbox to Kafka (ADR 0016, ADR 0018).
# Broker from SPRING_KAFKA_BOOTSTRAP_SERVERS, or from Testcontainers in tests.
ledger.outbox.topic=ledger.transfers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# The consumer reads its own envelope type, so no Java type travels in the headers.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Idempotent producer: broker-side retries cannot duplicate or reorder within a partition.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail a send within the relay's 10 s wait instead of the 2 minute default, so a broker outage
# ends the batch and the rows stay pending.
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.producer.properties.max.block.ms=5000
# Statement consumer (ADR 0017): its own envelope type, no Java type from the headers; a value
# that does not parse is handed to the error handler instead of failing the poll loop.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=tech.lucassantana.ledger.statement.TransferEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
# The Kafka clients log every configuration value at INFO on each start.
logging.level.org.apache.kafka=WARN

# Phase 4: traces, metrics and logs (ADR 0021, ADR 0022).
# OTLP endpoints (HTTP) come from the environment, for example:
#   MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://<collector>:4318/v1/traces
#   MANAGEMENT_OTLP_METRICS_EXPORT_URL=http://<collector>:4318/v1/metrics
# or from LgtmStackContainer in OtlpExportSmokeTest.
# Both OTLP exports are off unless switched on next to the endpoint
# (MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED=true, MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=true, as
# compose.yaml does). Without that, the metrics exporter would push to its default
# localhost:4318 every minute and log each failure wherever no collector runs (a plain java -jar,
# the kind deployment). Only the OTLP export is switched off: spans, the W3C propagation into
# the outbox row and the Kafka header, and the in-process meters stay on.
management.otlp.metrics.export.enabled=false
management.tracing.export.otlp.enabled=false
# Kafka observation: the producer writes the W3C traceparent header and the listener continues
# the trace from it (both false by default).
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Boot's default, written down because a deployment overrides it with
# MANAGEMENT_TRACING_SAMPLING_PROBABILITY; tests and the local stack use 1.0 (ADR 0021).
management.tracing.sampling.probability=0.1
# Buckets for http.server.requests, so p99 per status can be computed on the backend (ADR 0022).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Logs stay on the console, as ECS JSON with trace and span ids; no OTLP log export (ADR 0022).
logging.structured.format.console=ecs
management.logging.export.otlp.enabled=false
