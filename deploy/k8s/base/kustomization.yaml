apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base for any cluster (ADR 0024). Overlays set the image and the cluster-specific parts.
namespace: ledger
labels:
  - pairs:
      app.kubernetes.io/part-of: double-entry-ledger
resources:
  - namespace.yaml
  - config.yaml
  - secret.yaml
  - postgres.yaml
  - kafka.yaml
  - ledger.yaml
