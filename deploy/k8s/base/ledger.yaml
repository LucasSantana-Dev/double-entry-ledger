apiVersion: v1
kind: Service
metadata:
  name: ledger
spec:
  selector:
    app.kubernetes.io/name: ledger
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
spec:
  # One replica and Recreate: the outbox has a single relay (ADR 0016), so two pods must never
  # run side by side, not even during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # Flyway needs the database at startup and KafkaAdmin creates the topics then, so the
        # application starts only once both answer, instead of crash-looping until they do.
        - name: wait-for-dependencies
          image: postgres:18.7-alpine
          command:
            - sh
            - -c
            # -U only names a user: pg_isready does not log in, and uid 10001 has no passwd entry.
            - until pg_isready -h postgres -p 5432 -U ledger -q && nc -z -w 2 kafka 9092; do echo waiting; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: ledger
          image: double-entry-ledger
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-config
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ledger-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db
                  key: password
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          # Phase 5 (ADR 0027): application, PostgreSQL and Kafka limits add up to 1,600 Mi, the
          # same as compose.yaml; the JVM settings are the image defaults (Dockerfile).
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
